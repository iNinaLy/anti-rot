services:
  app:
    build: .
    image: ${APP_IMAGE:-daymark:local}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      MEDIA_DIR: /media
      STATIC_DIR: /app/frontend/dist
      PUSH_KEYS_FILE: /data/push-keys.json
      BACKUP_DIR: /backups
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8000"
    volumes:
      - database:/data
      - media:/media
      - backups:/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  ollama:
    image: ollama/ollama:latest
    profiles: [ai]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
volumes:
  database:
  media:
  backups:
  ollama:
